name: ci

# Optional for the upstream repository: lint, the Python tests, Octave parity
# and the vision interop check. Runs on pushes to main and on every PR.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: lint + tests (no Octave, no YOLO)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests tools
      - name: Model spec is fresh
        run: python tools/mdl_spec.py --check
      - name: Tests (committed Octave fixtures; live-Octave and vision tests skip)
        run: pytest -q -m "not vision"
      - name: Original vision unit tests
        run: python -m unittest discover -s python -p "test_*.py"

  octave:
    name: Octave parity (original MATLAB tests, templates, fixtures)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Octave
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends octave
      - name: Install
        run: pip install -e ".[dev]"
      - name: Octave version
        run: octave-cli --version | head -1
      - name: Live Octave tests
        run: pytest -q -m octave -rs
      - name: Committed fixtures regenerate from this Octave
        run: python tools/make_fixtures.py --check
      - name: All eight SIL scenarios through Octave
        run: |
          python tools/make_fixtures.py --scenarios outputs/scenario_parity
          python - <<'PY'
          from pathlib import Path
          from qdrone_autoland import parity
          worst = 0.0
          n = 0
          for block, i, o in parity.fixture_pairs(Path("outputs/scenario_parity")):
              x, e = parity.load_csv(i), parity.load_csv(o)
              err = parity.compare(e, parity.run_sequence(block, x))
              n += len(x)
              worst = max(worst, err)
              assert err <= 1e-12, (block, i.name, err)
          print(f"scenario parity: {n} ticks, max abs error {worst:g}")
          PY

  vision:
    name: interop with yolo_pad_direct_stream_fresh.py
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (CPU torch, headless OpenCV)
        run: |
          pip install torch==2.14.1 torchvision==0.29.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -c .github/constraints-vision.txt ultralytics opencv-python-headless Pillow
          pip install -e ".[dev]"
      - name: Vision interop tests
        run: pytest -q -m vision -rs

  windows:
    name: tests + serve timing on Windows (no Octave, no YOLO)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Tests
        run: pytest -q -m "not vision and not octave"
      - name: serve --mode dry-run for 5 s (timing and CPU)
        run: qautoland serve --mode dry-run --duration 5
