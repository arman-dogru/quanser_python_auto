name: ci

on:
  push:
    branches: [main, python-port]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Snapshot and spec freshness
        run: |
          python tools/verify_snapshot.py
          python tools/slx_spec.py --check
      - name: Tests (Octave fixtures are committed; YOLO tests skip without ultralytics)
        run: pytest -q
  octave-fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Octave
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends octave
      - name: Regenerate fixtures and compare
        run: python tools/make_parity_fixtures.py --check
