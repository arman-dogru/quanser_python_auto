[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quanser-landing"
version = "0.1.0"
description = "Python port of the Quanser QDrone autonomous-landing Simulink/MATLAB project (monitor-only)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
detect = ["ultralytics>=8.3", "opencv-python-headless>=4.8"]
plots = ["matplotlib>=3.7"]
dev = ["pytest>=7", "ruff>=0.5", "matplotlib>=3.7"]

[project.scripts]
qlanding = "quanser_landing.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
markers = [
    "octave: needs octave-cli on PATH",
    "yolo: needs the optional ultralytics dependency",
]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["tools/dataset_legacy", "reference", "tools/verify_snapshot.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
